<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AEGIS — Active Earth Geomagnetic Imaging System: a real-time, browser-based 3D visualization of Earth's magnetosphere, driven by live NOAA space-weather data.">
    <meta name="color-scheme" content="dark">
    <title>AEGIS — Active Earth Geomagnetic Imaging System</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        #error {
            position: fixed;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            color: #ff4444;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            pointer-events: none;
            z-index: 10;
        }

        /* Status / legend panel — populated and revealed by ui.js once data loads */
        #status {
            display: none;
            position: fixed;
            bottom: 1.5rem;
            left: 1.5rem;
            color: rgba(255, 255, 255, 0.6);
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="error"></div>
    <div id="status"></div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
